name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (mismo que el build de deploy)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle con cache
        uses: gradle/actions/setup-gradle@v4

      - name: Tests de server y core
        run: ./gradlew :server:test :core:jvmTest

      - name: Compilar cliente wasm
        run: ./gradlew :shared:compileKotlinWasmJs

      - name: Compilar Android
        run: ./gradlew :androidApp:compileDebugKotlin

      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            server/build/reports/tests/
            core/build/reports/tests/
