name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: APK firmado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle con cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore desde secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maestro-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/maestro-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compilar APK de release
        run: ./gradlew :androidApp:assembleRelease

      - name: Nombrar APK con la versión
        run: cp androidApp/build/outputs/apk/release/androidApp-release.apk "maestro-${{ github.ref_name }}.apk"

      - name: APK como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ github.ref_name }}
          path: maestro-${{ github.ref_name }}.apk

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "maestro-${{ github.ref_name }}.apk" \
            --title "Maestro ${{ github.ref_name }}" \
            --generate-notes
