name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read  # para saber qué PR trae el APK de prueba

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: APK firmado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle con cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore desde secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maestro-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/maestro-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compilar APK de release
        run: ./gradlew :androidApp:assembleRelease

      # Mismo esquema que Movi (`scripts/build-apk.sh` de Movi): app + buildType + versión.
      #   productivo (tag v*):  maestro-release-1.7.apk
      #   de prueba (rama):     maestro-prueba-1.7-pr24.apk  (o -<sha> si la rama no tiene PR abierto)
      # El de prueba dice qué PR trae, y no pisa al productivo en Drive.
      - name: Nombrar APK como en Movi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]*=' androidApp/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="maestro-release-${VERSION}.apk"
          else
            PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number -q '.[0].number' 2>/dev/null || true)
            QUE_TRAE="${PR:+pr$PR}"
            QUE_TRAE="${QUE_TRAE:-${GITHUB_SHA::7}}"
            NAME="maestro-prueba-${VERSION}-${QUE_TRAE}.apk"
          fi
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "listo: $NAME"

      - name: APK como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$APK_NAME" \
            --title "Maestro ${{ github.ref_name }}" \
            --generate-notes
