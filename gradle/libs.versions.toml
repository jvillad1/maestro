[versions]
agp = "8.7.3"
# El R8 que trae AGP 8.7.3 (8.7.18) no lee la metadata de Kotlin 2.2 («An error occurred when parsing
# kotlin metadata»). Kotlin 2.2 pide R8 8.11 o más nuevo (developer.android.com/build/kotlin-d8-r8-versions).
# Lo carga el `buildscript` de la raíz; se puede quitar cuando AGP traiga uno igual o más nuevo. Igual que Movi.
r8 = "8.11.32"
android-compileSdk = "36"
# Movi usa 24. Maestro se queda en 26 porque `PlatformTime.android.kt` y `PlatformDate.android.kt` usan
# `java.time`, que no existe antes de Android 8 sin desugaring.
android-minSdk = "26"
android-targetSdk = "36"
androidx-activityCompose = "1.9.3"
androidx-core = "1.13.1"
# Maestro va en Compose Multiplatform 1.9 (Movi en 1.8): la línea 2.9.x de lifecycle es la que le corresponde.
androidx-lifecycle = "2.9.6"
navigation-compose = "2.9.2"
compose-multiplatform = "1.9.3"
kotlin = "2.2.21"
kotlinx-coroutines = "1.10.1"
kotlinx-serialization = "1.7.3"
ktor = "3.3.1"
logback = "1.5.38"
bcrypt = "0.10.2"
datastore = "1.1.1"
sqldelight = "2.0.2"
exposed = "0.55.0"
hikaricp = "5.1.0"
postgresql = "42.7.4"
h2 = "2.3.232"

[libraries]
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Ktor client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Ktor server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-tests = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Auth / security
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }

# SQLDelight
sqldelight-runtime        = { module = "app.cash.sqldelight:runtime",                  version.ref = "sqldelight" }
sqldelight-coroutines     = { module = "app.cash.sqldelight:coroutines-extensions",     version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver",            version.ref = "sqldelight" }
sqldelight-native-driver  = { module = "app.cash.sqldelight:native-driver",             version.ref = "sqldelight" }
sqldelight-sqlite-driver  = { module = "app.cash.sqldelight:sqlite-driver",             version.ref = "sqldelight" }

# Exposed & PostgreSQL
exposed-core        = { module = "org.jetbrains.exposed:exposed-core",        version.ref = "exposed" }
exposed-dao         = { module = "org.jetbrains.exposed:exposed-dao",         version.ref = "exposed" }
exposed-jdbc        = { module = "org.jetbrains.exposed:exposed-jdbc",        version.ref = "exposed" }
hikaricp            = { module = "com.zaxxer:HikariCP",                       version.ref = "hikaricp" }
postgresql-driver   = { module = "org.postgresql:postgresql",                 version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
