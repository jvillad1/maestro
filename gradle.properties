org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
# Igual que Movi. Kotlin/Native compila dentro de este daemon. En esta Mac, ~/.gradle/gradle.properties
# lo baja a 2g. Los links optimizados de iOS los serializa el build service de build.gradle.kts.
kotlin.daemon.jvmargs=-Xmx8192m
android.useAndroidX=true
android.nonTransitiveRClass=true

# El wasm instala sus paquetes con npm y no con yarn, igual que Movi (#505 allá). En Railway, yarn
# fallaba de forma intermitente con «Waiting for the other yarn instance to finish».
kotlin.js.yarn=false

# Google Play exige targetSdk 36 desde el 31-ago-2026. AGP 8.7.3 compila contra 36, pero avisa que solo
# se probó hasta 35; esto calla ese aviso. Igual que Movi.
android.suppressUnsupportedCompileSdk=36
