ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [com.maestro.server.ApplicationKt.module]
    }
}

database {
    url = "jdbc:h2:mem:maestro;DB_CLOSE_DELAY=-1"
    url = ${?DATABASE_URL}
    driver = "org.h2.Driver"
}

jwt {
    secret = "maestro-dev-secret-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "maestro"
    audience = "maestro-users"
    expirationDays = 30
}
