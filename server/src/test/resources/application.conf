ktor {
    deployment {
        port = 8080
    }
    application {
        modules = [com.maestro.server.ApplicationKt.module]
    }
}

database {
    url = "jdbc:h2:mem:maestro_test;DB_CLOSE_DELAY=-1"
    driver = "org.h2.Driver"
}

jwt {
    secret = "maestro-test-secret"
    issuer = "maestro"
    audience = "maestro-users"
    expirationDays = 30
}
